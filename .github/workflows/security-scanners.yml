# sync-sha: 89b5615be8bd5fc629494e81d4b72020c4d705d0ea529a3655638a8712e6e9c8
name: Security scanners

# Static analysis gate on every PR/push: flawfinder (blocking at >=4),
# clang-tidy (cert-*, security.*, blocking) and semgrep (advisory).
#
# Gating policy, and why it differs per tool:
#   flawfinder  -- blocks at severity >=4 only. It is a grep for risky APIs and
#                  is noisy below that; gating on every hit would train everyone
#                  to ignore it.
#   clang-tidy  -- blocks on cert-* and clang-analyzer-security.*. These are
#                  path-sensitive and near-zero-FP on code this size.
#   semgrep     -- blocks at WARNING and above; INFO stays advisory. Promoted
#                  from fully-advisory 2026-07-30.
#                  WARNING, not ERROR, is the gate level on purpose: the
#                  registry's ERROR tier has no C rules that fire on this kind
#                  of code (verified -- an ERROR-only gate matched 48 rules and
#                  0 findings against a deliberate strcpy/format-string file,
#                  i.e. it could never go red). WARNING is the lowest tier with
#                  real signal: it catches that same file via
#                  insecure-use-string-copy-fn. src/ is clean at WARNING+ today,
#                  so this goes in green.
#                  Registry C coverage is thin either way (~9 rules reach these
#                  files) -- semgrep is the third line here, behind flawfinder
#                  and clang-tidy, which carry the real C weight.
#
# Action pins (keep in sync with build-test.yml):
# actions/checkout@v5.1.0        -> fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
# actions/upload-artifact@v5.0.0 -> 330a01c490aca151604b8cf639adc76d48f6c5d4

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  # Triggered by ci.yml, which lanes the PR suite so peak runner use stays
  # bounded. No push/pull_request trigger here on purpose: two entry points
  # would run this twice per PR and defeat the laning.
  workflow_call: {}

concurrency:
  group: security-scanners-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scanners:
    name: Security scanners
    runs-on: ${{ fromJSON(vars.POOL || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - name: Checkout module
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Load version pins
        run: bash .github/scripts/load-versions.sh

      - name: Install dependencies
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=120 update
          sudo apt-get -o DPkg::Lock::Timeout=120 install -y \
            flawfinder clang-tidy bear python3 python3-pip pipx curl \
            build-essential libpcre2-dev zlib1g-dev
          # semgrep via pipx: PEP 668 blocks a bare `pip3 install` into the
          # system Python on the Ubuntu 24.04 self-hosted runner.
          # PINNED: this executes downloaded code on a persistent self-hosted
          # runner, so pin the version for a reproducible, non-moving supply
          # chain (bump deliberately, same as the nginx pins). Unpinned = a
          # compromised/regressed release runs here silently on the next PR.
          SEMGREP_PIN="semgrep==1.172.0"
          SEMGREP_WANT="1.172.0"
          if command -v pipx >/dev/null; then
            # --force is load-bearing on the self-hosted runner: pipx keeps its
            # venvs between jobs, and a bare `pipx install` against an existing
            # semgrep venv prints "already seems to be installed", leaves the
            # OLD version in place and still exits 0. The pin bump above would
            # then be cosmetic -- the previous release keeps scanning every PR,
            # which is precisely the silent supply-chain drift the pin exists to
            # prevent. Hosted runners start clean, so this only matters here.
            pipx install --force --quiet "$SEMGREP_PIN"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
          else
            pip3 install --quiet --user --break-system-packages "$SEMGREP_PIN"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          # Assert the pin actually took. Without this the job cannot tell a
          # successful bump from a silently-skipped one: both are exit 0.
          got="$(semgrep --version 2>/dev/null | head -1)"
          if [ "$got" != "$SEMGREP_WANT" ]; then
            echo "semgrep pin did not apply: want $SEMGREP_WANT, got '${got:-<none>}'" >&2
            exit 1
          fi
          echo "semgrep $got (pinned)"

      # clang-tidy needs ngx_auto_config.h, which only exists after configure.
      # Reuse ci-build.sh so this analyzes against the same pinned nginx the
      # build jobs use -- not a "latest mainline" that could drift apart from it.
      - name: Restore build caches
        uses: ./.github/actions/build-cache
        with:
          mode: module
          nginx-version: ${{ env.NGINX_VERSION }}

      # Dropping the addon objects is load-bearing, not belt-and-braces. bear
      # records compiler invocations as they happen, so it can only capture a
      # compile that actually runs: against a warm build tree `make modules`
      # reports "Nothing to be done" and bear writes a VALID, EMPTY [] database.
      # clang-tidy -p then finds no entry for any file, analyzes nothing, and
      # exits 0 -- a green gate that checked zero lines. Measured: warm tree ->
      # 0 entries, forced recompile -> 3. The db assertion below is the backstop;
      # this rm is what makes it hold.
      #
      # Only objs/addon (this module's three objects) is removed, NOT the tree.
      # NO_CACHE=1 would also work and is the obvious knob, but it deletes the
      # whole build tree AND disables ccache (ci-build.sh:191, :248), so the
      # scanner job would do a full cold nginx build on every PR and the cache
      # restore above it would be dead weight. This recompiles three files
      # against an otherwise warm tree.
      - name: Build module, capturing the real compile flags (bear)
        run: |
          set -euo pipefail
          N="$GITHUB_WORKSPACE/.build/nginx-${NGINX_VERSION}-module"
          # Glob, not the module name: rename-module.sh rewrites `skel`
          # everywhere, and a workflow that missed the rename would silently go
          # back to capturing nothing.
          rm -rf "$N/objs/addon" "$N"/objs/*.so
          bear --output compile_commands.json -- \
            bash ci/tools/ci-build.sh nginx "$NGINX_VERSION" module

      # A compilation database that silently loses its entries turns every
      # downstream check into a no-op, so assert the shape before trusting it:
      # one entry per src/*.c, each pointing at a file that exists.
      - name: Verify the compilation database covers src/
        env:
          # Read from the environment, never interpolated into the script body:
          # a `${{ }}` expansion is textual substitution into the source about
          # to run, so anything attacker-controllable becomes code. $GITHUB_WORKSPACE
          # is benign, but the habit is what zizmor's template-injection audit
          # enforces, and an exception here is one copy-paste from a real one.
          WS: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, sys
          ws = pathlib.Path(os.environ["WS"])
          want = {p.resolve() for p in (ws / "src").glob("*.c")}
          db = json.loads((ws / "compile_commands.json").read_text())
          got = {pathlib.Path(e["file"]).resolve() for e in db}
          missing = want - got
          if not want:
              sys.exit("no src/*.c found -- wrong working directory?")
          if missing:
              sys.exit("compile_commands.json missing: "
                       + ", ".join(sorted(p.name for p in missing)))
          print(f"compilation database: {len(db)} entries, all of src/*.c covered")
          PY

      - name: flawfinder (gate on >=4)
        run: |
          set -euo pipefail
          flawfinder --minlevel=1 "$GITHUB_WORKSPACE/src/" 2>&1 | tee flawfinder.log
          if flawfinder --minlevel=4 --quiet "$GITHUB_WORKSPACE/src/" 2>/dev/null \
               | grep -Eq 'Hits = [1-9]'; then
            echo "flawfinder: high-severity (>=4) findings present" >&2
            exit 1
          fi
          echo "flawfinder: clean at >=4"

      - name: clang-tidy (cert-*, security.*)
        run: |
          set -euo pipefail
          # -p <dir> reads compile_commands.json: clang-tidy replays the exact
          # argv gcc got, so it parses the same preprocessor branches the build
          # compiled. The include list this replaced was a hand-kept second copy
          # of configure's output and had already drifted BOTH ways -- it was
          # missing src/event/quic, and carried src/http/v2 and /usr/include
          # that the real build never passes. A wrong -I is not a loud failure
          # here: clang-tidy keeps going and analyzes a different translation
          # unit than the one that ships. Nothing to maintain now; the flags
          # follow ci-build.sh automatically.
          #
          # The database records paths relative to the build tree, so run from
          # that directory -- clang-tidy resolves each entry against its own
          # "directory" field, but -p must point at the file itself.
          status=0
          for src in "$GITHUB_WORKSPACE"/src/*.c; do
            echo "--- clang-tidy: $(basename "$src") ---"
            # DeprecatedOrUnsafeBufferHandling is disabled: it flags every
            # memcpy/sprintf in existence, including nginx's own idioms, and
            # would make the check unusable rather than safer.
            #
            # --warnings-as-errors='*' is NOT as wide as it looks, and narrowing
            # it to the names in --checks would be a no-op. The leading `-*`
            # disables clang-diagnostic-* along with everything else, so the
            # compiler warnings the replayed argv carries -- including the
            # `-Werror` the real build passes -- are never raised as clang-tidy
            # findings, and `*` has nothing to promote beyond cert-* and
            # clang-analyzer-security.*. Measured on clang-tidy 19.1.7,
            # 2026-08-02: a `-Wunused-but-set-variable` in a -Werror translation
            # unit is an ERROR under --checks='clang-diagnostic-*' and exits 1,
            # and is not reported at all under the flags below (exit 0, byte-
            # identical output with `*` and with the scoped list). -header-filter
            # defaults to suppressing header diagnostics on top of that.
            #
            # So an nginx bump introducing a clang-only diagnostic in upstream
            # headers cannot redden this gate. What WOULD break the property is
            # adding clang-diagnostic-* to --checks; if that ever happens, scope
            # this flag in the same commit.
            clang-tidy "$src" -p "$GITHUB_WORKSPACE" \
              --checks='-*,cert-*,clang-analyzer-security.*,-clang-analyzer-security.insecureAPI.DeprecatedOrUnsafeBufferHandling' \
              --warnings-as-errors='*' 2>&1 | tee -a clang-tidy.log || status=1
          done
          exit "$status"

      - name: semgrep (gate on >=WARNING)
        run: |
          set -euo pipefail
          command -v semgrep >/dev/null || { echo "semgrep missing from PATH" >&2; exit 1; }
          # --jobs=1 is a correctness flag on a self-hosted runner, not a speed
          # flag. semgrep-core defaults to one OCaml domain per core (32 on this
          # box), each opening an io_uring ring against an 8 MB RLIMIT_MEMLOCK
          # shared with every other job on the host. Under runner load it
          # exhausts and semgrep-core dies with `Unix_error: Cannot allocate
          # memory io_uring_queue_init` -> exit 2, i.e. a load-dependent red
          # that has nothing to do with the code under review. Reproduced 3/3 on
          # a busy box and 0/3 on an idle one. src/ is three files, so the
          # parallelism was buying nothing. ci/linter/lint-c.sh carries the same
          # flag -- keep the two in sync or local stops predicting remote.
          # --metrics=off drops the scan-summary POST (2.76s -> 1.27s measured).
          #
          # Pass 1: full scan, every severity, never blocking. This is what
          # lands in the uploaded artifact for a human to read -- INFO findings
          # stay visible even though they do not gate.
          semgrep scan --config p/c --config p/security-audit \
            --jobs=1 --metrics=off \
            "$GITHUB_WORKSPACE/src/" 2>&1 | tee semgrep.log || true
          # Pass 2: the gate. --error makes semgrep exit 1 on any match at
          # WARNING or ERROR. Exit 2 (fatal: bad config, network, parse error)
          # also fails the step rather than passing silently -- a scanner that
          # could not run is not a clean scan.
          semgrep scan --config p/c --config p/security-audit \
            --severity=WARNING --severity=ERROR --error \
            --jobs=1 --metrics=off \
            "$GITHUB_WORKSPACE/src/" 2>&1 | tee -a semgrep.log
          echo "semgrep: clean at >=WARNING"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: security-reports
          path: |
            ${{ github.workspace }}/flawfinder.log
            ${{ github.workspace }}/clang-tidy.log
            ${{ github.workspace }}/semgrep.log
          retention-days: 14
