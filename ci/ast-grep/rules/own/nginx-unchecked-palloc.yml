id: nginx-unchecked-palloc
language: c
severity: info
message: >-
  Pool allocation site — verify the result is NULL-checked before use.
  ngx_palloc/ngx_pnalloc/ngx_pcalloc return NULL on failure; dereferencing the
  result without `if (p == NULL) return NGX_ERROR;` (or
  NGX_HTTP_INTERNAL_SERVER_ERROR) is a NULL-deref crash under memory pressure.
note: >-
  Candidate only — this flags every pool-alloc call, it does NOT prove the guard
  is missing. The reviewer confirms whether a NULL check follows. Encoding the
  guard structurally is unreliable (declaration-init vs assignment, return/goto
  guards), so verification is left to the model pass.

  Do not "improve" this into a guard-aware rule with `not: precedes` — both
  settings were measured against ast-grep 0.44.1 on 2026-08-10 and both are
  worse than this candidate tier:

  - `stopBy: neighbor` is comment-sensitive. It matches `p = ngx_palloc(...)`
    followed by `if (p == NULL)`, but a TRAILING COMMENT on the alloc line is a
    sibling node that stops the search, so the finding silently disappears.
    Identical code flips flagged -> clean by adding `/* ... */`.
  - `stopBy: end` scans to the end of the enclosing block, so ANY later `if`
    mentioning NULL anywhere in the function suppresses the finding. It went to
    zero matches on a deliberately unguarded control — a rule that cannot go red.

  There is no setting between the two. A rule that is either comment-fragile or
  a permanent no-op is worse than one honest candidate per alloc site, which is
  why this stays `info` and outside PROMOTED. See the measurement note in
  ci/linter/lint-astgrep.sh: 318 of 368 findings across the module repos are
  this rule, and in nginx C a propagated NULL is frequently deliberate.
rule:
  kind: call_expression
  has:
    field: function
    regex: ^(ngx_palloc|ngx_pnalloc|ngx_pcalloc)$
